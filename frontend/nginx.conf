server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Požadavky na /api/... přeposílá na backend (kontejner "api" v docker-compose).
    # Bez lomítka na konci proxy_pass se cesta předá beze změny: /api/weatherforecast -> http://api:8080/api/weatherforecast
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vše ostatní je Angular: když soubor neexistuje (např. /produkty/5),
    # vrátí se index.html a cestu vyřeší Angular router v prohlížeči.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
